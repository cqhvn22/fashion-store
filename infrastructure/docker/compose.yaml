services:
  frontend:
    build: ../../frontend
    ports: ["3000:80"]
  api-gateway:
    build: {context: ../../backend, dockerfile: api-gateway/Dockerfile}
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      AI_SERVICE_URL: http://ai-service:8000
    ports: ["8080:8080"]
    depends_on: [auth-service, catalog-service, order-service, ai-service]
  auth-service:
    build: {context: ../../backend, dockerfile: auth-service/Dockerfile}
    ports: ["8081:8081"]
  catalog-service:
    build: {context: ../../backend, dockerfile: catalog-service/Dockerfile}
    ports: ["8082:8082"]
  order-service:
    build: {context: ../../backend, dockerfile: order-service/Dockerfile}
    ports: ["8083:8083"]
  notification-service:
    build: {context: ../../backend, dockerfile: notification-service/Dockerfile}
    ports: ["8084:8084"]
  ai-service:
    build: ../../ai-service
    ports: ["8000:8000"]
