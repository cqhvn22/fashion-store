services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fashion}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "../postgres/init:/docker-entrypoint-initdb.d:ro"]
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-fashion}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db", "../mongodb/init:/docker-entrypoint-initdb.d:ro"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
volumes:
  postgres_data:
  mongo_data:
