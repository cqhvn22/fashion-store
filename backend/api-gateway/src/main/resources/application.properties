quarkus.application.name=api-gateway
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
gateway.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}
gateway.order.url=${ORDER_SERVICE_URL:http://localhost:8083}
gateway.ai.url=${AI_SERVICE_URL:http://localhost:8000}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.access-control-allow-credentials=true
