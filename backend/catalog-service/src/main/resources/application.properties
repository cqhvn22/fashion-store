quarkus.application.name=catalog-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8082}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:fashion}
quarkus.datasource.password=${POSTGRES_PASSWORD:change-me}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_catalog}
quarkus.flyway.migrate-at-start=true
quarkus.generate-code.grpc.scan-for-proto=com.fashion:backend-common
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=${GRPC_PORT:9000}
internal.api.key=${INTERNAL_API_KEY}
review.order.url=${ORDER_SERVICE_URL:http://localhost:8083}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
mp.jwt.verify.issuer=fashion-auth
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
catalog.media.directory=${CATALOG_MEDIA_DIRECTORY:./uploads}
