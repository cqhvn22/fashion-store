quarkus.application.name=notification-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8084}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:fashion}
quarkus.datasource.password=${POSTGRES_PASSWORD:change-me}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_notification}
quarkus.flyway.migrate-at-start=true
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.order-created.auto.offset.reset=earliest
mp.messaging.incoming.order-status.auto.offset.reset=earliest
mp.messaging.incoming.order-cancelled.auto.offset.reset=earliest
mp.messaging.incoming.payment-paid.auto.offset.reset=earliest
mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=fashion.order.created.v1
mp.messaging.incoming.order-created.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-status.connector=smallrye-kafka
mp.messaging.incoming.order-status.topic=fashion.order.status-changed.v1
mp.messaging.incoming.order-status.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-cancelled.connector=smallrye-kafka
mp.messaging.incoming.order-cancelled.topic=fashion.order.cancelled.v1
mp.messaging.incoming.order-cancelled.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-paid.connector=smallrye-kafka
mp.messaging.incoming.payment-paid.topic=fashion.payment.paid.v1
mp.messaging.incoming.payment-paid.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.jwt.verify.issuer=fashion-auth
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
notification.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
internal.api.key=${INTERNAL_API_KEY}
