quarkus.application.name=order-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8083}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:fashion}
quarkus.datasource.password=${POSTGRES_PASSWORD:change-me}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_order}
quarkus.flyway.migrate-at-start=true
quarkus.generate-code.grpc.scan-for-proto=com.fashion:backend-common
quarkus.grpc.clients.inventory.host=${CATALOG_GRPC_HOST:localhost}
quarkus.grpc.clients.inventory.port=${CATALOG_GRPC_PORT:9000}
quarkus.grpc.clients.inventory.plain-text=true
internal.api.key=${INTERNAL_API_KEY}
mp.jwt.verify.issuer=fashion-auth
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
payos.client-id=${PAYOS_CLIENT_ID:disabled}
payos.api-key=${PAYOS_API_KEY:disabled}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:disabled}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
payos.api-url=${PAYOS_API_URL:https://api-merchant.payos.vn}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
