quarkus.application.name=auth-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8081}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:fashion}
quarkus.datasource.password=${POSTGRES_PASSWORD:change-me}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_auth}
quarkus.flyway.migrate-at-start=true
mp.jwt.verify.issuer=fashion-auth
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_VERIFY_JWK}
auth.jwt.secret=${JWT_SECRET}
auth.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
auth.admin.email=${ADMIN_EMAIL:}
auth.admin.password=${ADMIN_PASSWORD:}
internal.api.key=${INTERNAL_API_KEY}
